name: Compare captured enrollment signature

on:
  push:
    branches: [codex/investigate-enrollment-signatures]

permissions:
  contents: read

jobs:
  replay:
    name: Compare captured signature across Xcode versions
    runs-on: macos-26
    timeout-minutes: 2
    steps:
      - name: Check out the standalone replay without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the runner operating system
        run: sw_vers
      - name: Replay the captured vector with the original Xcode 26.4.1
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
        run: |
          mkdir -p .build/verification
          set -o pipefail
          xcodebuild -version
          swift --version
          swift Diagnostics/signature-vector-comparison.swift Diagnostics/signature-vectors.json \
            2>&1 | tee .build/verification/signature-replay-xcode-26.4.1.log
      - name: Replay the same vector with Xcode 26.6
        if: always()
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          mkdir -p .build/verification
          set -o pipefail
          xcodebuild -version
          swift --version
          swift Diagnostics/signature-vector-comparison.swift Diagnostics/signature-vectors.json \
            2>&1 | tee .build/verification/signature-replay-xcode-26.6.log
      - name: Retain verification API and toolchain comparison results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enrollment-signature-vector-comparison
          path: .build/verification/signature-replay-*.log
          retention-days: 7
