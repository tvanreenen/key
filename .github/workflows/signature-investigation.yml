name: Verify full-width enrollment fixture keys

on:
  push:
    branches: [codex/investigate-enrollment-signatures]

permissions:
  contents: read

jobs:
  replay:
    name: Verify derived fixture keys on macOS 26
    runs-on: macos-26
    timeout-minutes: 2
    steps:
      - name: Check out the standalone diagnostic without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the operating system, architecture, and Xcode toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Verify the public vector using independent arithmetic and OpenSSL
        run: |
          mkdir -p .build/verification/signature-platform
          set -o pipefail
          python3 Diagnostics/signature-platform-reference.py Diagnostics/signature-vectors.json \
            .build/verification/signature-platform \
            2>&1 | tee .build/verification/signature-platform/reference.log
      - name: Compare small fixture keys, full-width keys, and equivalent signatures
        run: |
          set -o pipefail
          swiftc -warnings-as-errors Sources/KeyCore/V3P256Signature.swift \
            Diagnostics/signature-key-pattern.swift -o .build/verification/signature-platform/replay
          .build/verification/signature-platform/replay \
            .build/verification/signature-platform/expected.json \
            2>&1 | tee .build/verification/signature-platform/key-pattern.log
      - name: Retain the platform comparison and public reference data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature-derived-fixture-keys
          path: .build/verification/signature-platform/
          retention-days: 7
