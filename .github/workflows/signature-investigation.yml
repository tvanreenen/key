name: Compare signature verification across macOS versions

on:
  push:
    branches: [codex/investigate-enrollment-signatures]

permissions:
  contents: read

jobs:
  replay:
    name: Investigate signature verification (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26
            runner: macos-26
            artifact: macos-26
          - name: macOS 27
            runner: xcode-27
            artifact: macos-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 2
    steps:
      - name: Check out the standalone diagnostic without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the operating system, architecture, and Xcode toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Verify the public vector using independent arithmetic and OpenSSL
        run: |
          mkdir -p .build/verification/signature-platform
          set -o pipefail
          python3 Diagnostics/signature-platform-reference.py Diagnostics/signature-vectors.json \
            .build/verification/signature-platform \
            2>&1 | tee .build/verification/signature-platform/reference.log
      - name: Compare Apple encodings, hashes, and signature verification APIs
        run: |
          set -o pipefail
          swift Diagnostics/signature-platform-comparison.swift \
            .build/verification/signature-platform/expected.json \
            2>&1 | tee .build/verification/signature-platform/apple.log
      - name: Retain the platform comparison and public reference data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature-platform-${{ matrix.artifact }}
          path: .build/verification/signature-platform/
          retention-days: 7
